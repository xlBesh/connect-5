<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Connect 5</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <div class="game">
    <h1>Connect 5</h1>

    <div class="players">
      <label>
        <input
          type="checkbox"
          id="aiA"
        >
        AI for Player A 🔴
      </label>

      <label>
        <input
          type="checkbox"
          id="aiB"
        >
        AI for Player B 🟡
      </label>
    </div>

    <p id="turn">
      Turn: Player A 🔴
    </p>

    <div class="controls">
      <button id="undo">
        ↶ Undo
      </button>

      <button id="redo">
        ↷ Redo
      </button>

      <button id="restart">
        ⟳ Restart
      </button>
    </div>

    <div class="solver-panel">
      <h3>🧠 Solver</h3>

      <label for="thinkTime">
        Thinking time
      </label>

      <select id="thinkTime">
        <option value="300">
          0.3 sec
        </option>

        <option
          value="700"
          selected
        >
          0.7 sec
        </option>

        <option value="1500">
          1.5 sec
        </option>

        <option value="3000">
          3 sec
        </option>
      </select>

      <p id="solverStatus">
        Ready
      </p>
    </div>

    <div class="analysis-wrap">

      <div
        id="analysis"
        class="analysis"
      >
        <div class="analysis-cell">?</div>
        <div class="analysis-cell">?</div>
        <div class="analysis-cell">?</div>
        <div class="analysis-cell">?</div>
        <div class="analysis-cell">?</div>
        <div class="analysis-cell">?</div>
        <div class="analysis-cell">?</div>
        <div class="analysis-cell">?</div>
        <div class="analysis-cell">?</div>
      </div>

      <div id="board"></div>

      <div class="column-numbers">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
      </div>

    </div>

    <p class="legend">
      W = forced win ·
      D = forced draw ·
      L = forced loss ·
      ? = not proven
    </p>

  </div>

  <script src="script.js"></script>

</body>
</html>
